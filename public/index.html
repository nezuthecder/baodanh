<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng điểm danh học sinh</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --text:#1d2433; --muted:#667085; --line:#e3e7ef; --ok:#12a150; --bad:#d92d20; --pri:#2858d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --text:#e8ecf4; --muted:#98a2b3; --line:#2c3341; --pri:#6f95ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  header { max-width:1200px; margin:0 auto 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { font-size:22px; margin:0; }
  h2 { margin:24px 0 10px; font-size:18px; border-left:4px solid var(--pri); padding-left:10px; }
  main { max-width:1200px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card.done { border-color:var(--ok); }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .head b { font-size:17px; }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .row label { flex:1; min-width:150px; display:flex; gap:8px; align-items:center; cursor:pointer; font-size:14px; }
  input[type=number] { width:80px; }
  input[type=number], input[type=text], input[type=date] { padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  .reason { width:100%; }
  .hidden { display:none !important; }
  .total { margin-top:10px; padding:8px 10px; border-radius:8px; font-weight:600; display:flex; justify-content:space-between; }
  .total.red { background:rgba(217,45,32,.12); color:var(--bad); }
  .total.green { background:rgba(18,161,80,.14); color:var(--ok); }
  .total.neutral { background:rgba(40,88,214,.1); }
  button { font:inherit; border:0; border-radius:8px; padding:9px 14px; cursor:pointer; background:var(--pri); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .submit { width:100%; margin-top:10px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:12px; z-index:10; }
  .modal > div { background:var(--card); border-radius:14px; padding:18px; width:min(560px,100%); max-height:92vh; overflow:auto; }
  .item { border:1px solid var(--line); border-radius:10px; padding:10px; margin:10px 0; }
  .item img, .thumbs img { max-width:100%; max-height:160px; border-radius:8px; margin-top:8px; display:block; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  #cards { max-width:640px; margin:0 auto; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:10px 0; }
  .tab { background:var(--card); color:var(--text); border:1px solid var(--line); padding:8px 14px; }
  .tab.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  .tab.okTab:not(.on) { border-color:var(--ok); color:var(--ok); }
  .tab.errorTab:not(.on) { border-color:var(--bad); color:var(--bad); }
  .tab.errorTab.on { background:var(--bad); border-color:var(--bad); }
  .status-mark.error { color:var(--bad); }
  .tab.errorTab.on .status-mark.error { color:#fff; }
  .status-mark.ok { color:var(--ok); }
  .pager { max-width:640px; margin:14px auto; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; background:rgba(18,161,80,.15); color:var(--ok); }
  .auth { max-width:420px; margin:40px auto; }
  .auth h2 { margin-top:0; }
  .auth form, .user-form { display:grid; gap:10px; }
  .auth input, .user-form input { width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  .password-field { display:flex; gap:6px; margin-top:4px; }
  .password-field input { margin:0; }
  .password-toggle { flex:none; min-width:76px; padding:6px 10px; }
  .account { display:flex; align-items:center; gap:10px; }
  .admin-panel { margin-bottom:18px; }
  .section-nav { justify-content:flex-start; margin:0 0 14px; }
  .app-section { margin-bottom:18px; }
  .offline-tools { margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .offline-tools #syncStatus { flex:1; min-width:220px; }
  .user-list { display:grid; gap:8px; }
  .user-entry { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  input[type=checkbox] { accent-color:var(--pri); }
  button:focus-visible, input:focus-visible { outline:3px solid color-mix(in srgb, var(--pri) 45%, transparent); outline-offset:2px; }
  @media (max-width:600px) {
    body {
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      overflow-x:hidden;
    }
    header { align-items:stretch; gap:10px; margin-bottom:12px; }
    h1 { flex:1 1 100%; font-size:clamp(19px, 5vw, 22px); }
    header > div:last-child { width:100%; }
    header > div:last-child label { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    header input[type=date] { min-width:0; flex:1; }
    .account { width:100%; justify-content:space-between; }
    .grid { grid-template-columns:minmax(0, 1fr); gap:10px; }
    .card { min-width:0; padding:12px; border-radius:10px; }
    .tabs {
      flex-wrap:nowrap;
      justify-content:flex-start;
      overflow-x:auto;
      overscroll-behavior-x:contain;
      scrollbar-width:thin;
      padding:2px 1px 8px;
      -webkit-overflow-scrolling:touch;
    }
    .tab { flex:0 0 auto; }
    .row { gap:8px; }
    .row label { min-width:0; }
    .row label input[type=checkbox] { width:20px; height:20px; flex:none; }
    input[type=number], input[type=text], input[type=date],
    .auth input, .user-form input { min-height:44px; font-size:16px; }
    input[type=number] { width:88px; }
    .head { align-items:flex-start; gap:8px; }
    .head > .muted { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:4px; }
    .head .siso { width:76px !important; }
    button { min-height:44px; padding:10px 12px; }
    .password-toggle { min-width:76px; }
    .pager { gap:6px; }
    .pager button { flex:1; padding:9px 6px; }
    .pager .muted { flex:none; text-align:center; }
    .auth { margin:20px auto; }
    .user-entry { align-items:flex-start; flex-wrap:wrap; }
    .user-entry > span:last-child { display:flex; flex-wrap:wrap; gap:6px; }
    .user-entry button { padding:8px 10px; }
  }
  @media (max-width:360px) {
    body { padding-left:max(8px, env(safe-area-inset-left)); padding-right:max(8px, env(safe-area-inset-right)); }
    .card { padding:10px; }
    .row label { font-size:13px; }
    .total { gap:6px; padding:8px; font-size:14px; }
    .pager { flex-wrap:wrap; }
    .pager .muted { order:-1; width:100%; }
  }
  :root {
    --bg:#f3f6fb; --card:#fff; --text:#182338; --muted:#718096; --line:#e3eaf3;
    --ok:#138a59; --bad:#d04b47; --pri:#4169e1; --accent:#0f9b8e;
    --shadow:0 12px 30px rgba(32,55,95,.07);
  }
  @media (prefers-color-scheme:dark) {
    :root {
      --bg:#101722; --card:#182231; --text:#edf3fc; --muted:#9aa9bd; --line:#2a394c;
      --ok:#4dcc94; --bad:#ff7772; --pri:#88a5ff; --accent:#52d3c4;
      --shadow:0 12px 30px rgba(0,0,0,.16);
    }
  }
  body {
    background:
      radial-gradient(ellipse at 8% 0%, rgba(65,105,225,.09), transparent 34rem),
      var(--bg);
    padding:24px;
  }
  header { margin-bottom:22px; }
  header h1 { font-size:clamp(21px, 3vw, 27px); letter-spacing:-.04em; }
  main { max-width:1100px; }
  h2 { letter-spacing:-.025em; }
  .card { border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .auth { margin:64px auto; }
  .auth h2 { border:0; padding:0; }
  .auth form label, .user-form label { display:grid; gap:6px; color:var(--muted); font-size:13px; font-weight:600; }
  input[type=number], input[type=text], input[type=date],
  .auth input, .user-form input {
    min-height:42px; border-color:var(--line); border-radius:10px; transition:border-color .16s, box-shadow .16s;
  }
  input:focus-visible { border-color:var(--pri); }
  button { border-radius:10px; box-shadow:0 3px 8px rgba(36,73,165,.12); transition:transform .16s, box-shadow .16s, background .16s; }
  button:not(:disabled):hover { transform:translateY(-1px); box-shadow:0 7px 16px rgba(36,73,165,.18); }
  button.ghost { box-shadow:none; }
  button.ghost:not(:disabled):hover { background:rgba(65,105,225,.08); box-shadow:none; }
  .offline-tools { border-radius:12px; box-shadow:none; }
  .section-nav { justify-content:flex-start; margin:0 0 18px; }
  .section-nav .tab { background:transparent; }
  .section-nav .tab.on { background:var(--pri); }
  .attendance-overview { margin-bottom:14px; padding:22px; overflow:hidden; position:relative; }
  .attendance-overview:after {
    content:""; position:absolute; width:190px; height:190px; right:-70px; top:-95px;
    border-radius:50%; background:rgba(65,105,225,.08); pointer-events:none;
  }
  .overview-top { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .eyebrow { color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.12em; }
  .attendance-overview h2 { margin:5px 0 3px; border:0; padding:0; font-size:24px; }
  .overview-caption { margin:0; color:var(--muted); font-size:14px; }
  .overview-date { flex:none; padding:7px 11px; border:1px solid var(--line); border-radius:99px; color:var(--muted); font-size:12px; font-weight:700; }
  .stat-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:20px; }
  .stat-card { min-width:0; padding:13px 14px; background:color-mix(in srgb, var(--bg) 62%, var(--card)); border:1px solid var(--line); border-radius:12px; }
  .stat-label { display:block; color:var(--muted); font-size:12px; font-weight:600; }
  .stat-value { display:block; margin-top:3px; font-size:24px; line-height:1.2; font-weight:800; letter-spacing:-.04em; }
  .stat-card.complete .stat-value { color:var(--ok); }
  .stat-card.remaining .stat-value { color:var(--pri); }
  .progress-track { height:5px; margin-top:14px; overflow:hidden; border-radius:99px; background:var(--line); }
  .progress-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg, var(--pri), var(--accent)); transition:width .25s ease; }
  #cards { max-width:680px; }
  #cards .card { border-radius:16px; padding:18px; }
  #cards .card.done { border-color:color-mix(in srgb, var(--ok) 55%, var(--line)); }
  .head { margin-bottom:14px; }
  .head b { font-size:20px; letter-spacing:-.03em; }
  .head > .muted { display:flex; align-items:center; gap:6px; }
  .siso { border-radius:8px !important; }
  .row { padding:11px 0; }
  .row label { font-size:14px; font-weight:550; }
  .row input[type=checkbox] { width:17px; height:17px; }
  .row input[type=number], .row input[type=text] { background:var(--card); }
  .total { margin-top:14px; padding:11px 12px; border-radius:10px; }
  .submit { margin-top:12px; min-height:46px; }
  .badge { padding:4px 9px; font-weight:700; }
  .class-state { display:inline-block; padding:4px 9px; border-radius:99px; background:rgba(112,128,150,.12); color:var(--muted); font-size:11px; font-weight:700; }
  .class-state.submitted { background:rgba(19,138,89,.12); color:var(--ok); }
  .stat-label { display:flex; align-items:center; gap:8px; }
  .stat-icon, .row-icon, .report-icon {
    display:inline-grid; flex:none; place-items:center; border-radius:10px;
  }
  .stat-icon { width:32px; height:32px; font-size:17px; }
  .row-icon { width:30px; height:30px; font-size:16px; }
  .report-icon { width:25px; height:25px; margin-right:6px; font-size:14px; vertical-align:middle; }
  .icon-lop { background:#e7edff; }
  .icon-thuvien { background:#fff0ca; }
  .icon-on { background:#e9e1ff; }
  .icon-ktx { background:#dff6e8; }
  .icon-ngoai { background:#ffe3d8; }
  .icon-ve { background:#dff3ff; }
  .icon-khac { background:#ffe1ec; }
  .stat-icon.classes-icon { background:#e7edff; }
  .stat-icon.students-icon { background:#dff3ff; }
  .stat-icon.complete-icon { background:#dff6e8; }
  .stat-icon.pending-icon { background:#fff0ca; }
  @media (prefers-color-scheme:dark) {
    .icon-lop, .stat-icon.classes-icon { background:#29375d; }
    .icon-thuvien, .stat-icon.pending-icon { background:#514324; }
    .icon-on { background:#3a3158; }
    .icon-ktx, .stat-icon.complete-icon { background:#214636; }
    .icon-ngoai { background:#50372f; }
    .icon-ve, .stat-icon.students-icon { background:#244355; }
    .icon-khac { background:#512f40; }
  }
  .pager { margin-top:16px; }
  @media (max-width:700px) {
    body { padding:16px; }
    header { margin-bottom:14px; }
    .attendance-overview { padding:18px; }
    .stat-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:16px; }
    .stat-card { padding:11px 12px; }
    .stat-value { font-size:22px; }
    #cards .card { padding:14px; }
  }
  @media (max-width:400px) {
    .overview-top { flex-wrap:wrap; }
    .attendance-overview h2 { font-size:21px; }
    .head { flex-wrap:wrap; }
    .head > .muted { width:100%; justify-content:flex-start; }
  }
</style>
</head>
<body>
<header>
  <h1>📋 Bảng điểm danh học sinh</h1>
  <div class="account hidden" id="account">
    <span class="muted" id="accountName"></span>
    <button class="ghost" id="logout">Đăng xuất</button>
  </div>
  <div><label class="muted">Ngày: <input type="date" id="date"></label></div>
</header>
<main>
  <section class="card auth hidden" id="loginPanel">
    <h2>Đăng nhập</h2>
    <form id="loginForm">
      <label>Tên đăng nhập<input name="username" autocomplete="username" required></label>
      <label>Mật khẩu
        <span class="password-field">
          <input name="password" type="password" autocomplete="current-password" required>
          <button class="ghost password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
        </span>
      </label>
      <button>Đăng nhập</button>
      <div class="muted" id="loginError" role="alert"></div>
    </form>
    <button class="ghost hidden" id="offlineLogin" type="button"></button>
  </section>
  <div id="app" class="hidden"></div>
</main>


<script>
const ROWS = [
  ['lop', 'Học sinh trên lớp'], ['thuvien', 'Học sinh thư viện'], ['on', 'Học sinh đi ôn'],
  ['ktx', 'Học sinh dưới KTX giáo viên'], ['ngoai', 'Học sinh ra ngoài'], ['ve', 'Học sinh về'], ['khac', 'Khác'],
];
const ROW_ICONS = {
  lop: '🏫', thuvien: '📚', on: '✏️', ktx: '🏠', ngoai: '🚶', ve: '🏡', khac: '💬',
};
const state = {};   // state[lop][key] = {on, qty, reason}
let classes = [], reports = [], currentUser = null, users = [];
let activeCache = null, offlineMode = false, offlineStorageError = false;
let activeSection = 'attendance';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CACHE_PREFIX = 'diemdanh-offline-v1:';
const LAST_USER_KEY = 'diemdanh-offline-last-user';

$('#date').value = new Date().toISOString().slice(0, 10);
$('#date').onchange = () => { saveDraft(); Object.keys(state).forEach((k) => delete state[k]); load(); };

function getOfflineCache(username) {
  try {
    const value = localStorage.getItem(CACHE_PREFIX + username);
    return value ? JSON.parse(value) : null;
  } catch (error) {
    console.error('Không đọc được dữ liệu offline:', error);
    return null;
  }
}

function saveOfflineCache() {
  if (!currentUser || !activeCache) return;
  try {
    activeCache.user = currentUser;
    localStorage.setItem(CACHE_PREFIX + currentUser.username, JSON.stringify(activeCache));
    localStorage.setItem(LAST_USER_KEY, currentUser.username);
    offlineStorageError = false;
  } catch (error) {
    offlineStorageError = true;
    console.error('Không lưu được dữ liệu offline:', error);
    const status = $('#syncStatus');
    if (status) status.textContent = 'Không lưu được dữ liệu offline trên thiết bị. Hãy kiểm tra dung lượng trình duyệt.';
  }
}

function cachedUser() {
  try {
    const username = localStorage.getItem(LAST_USER_KEY);
    if (!username) return null;
    const cached = getOfflineCache(username);
    return cached && cached.user ? cached : null;
  } catch (error) {
    console.error('Không đọc được tài khoản offline:', error);
    return null;
  }
}

function updateOfflineLogin() {
  const button = $('#offlineLogin');
  if (!button) return;
  const cached = cachedUser();
  button.classList.toggle('hidden', !cached);
  if (cached) button.textContent = `Tiếp tục offline với ${cached.user.username}`;
}

function restoreDraft() {
  const draft = activeCache && activeCache.drafts && activeCache.drafts[$('#date').value];
  if (!draft) return;
  Object.keys(state).forEach((key) => delete state[key]);
  Object.assign(state, draft);
}

function saveDraft() {
  if (!activeCache) return;
  activeCache.drafts ||= {};
  activeCache.drafts[$('#date').value] = state;
  saveOfflineCache();
}

function reportsForDate(source, date) {
  return (source || []).filter((report) => report.date === date);
}

function combineWithPending(source, pending, date) {
  const combined = reportsForDate(source, date).slice();
  for (const item of pending || []) {
    if (item.date !== date) continue;
    const report = { ...item, createdBy: item.createdBy || currentUser.username };
    const index = combined.findIndex((entry) => entry.date === item.date && entry.lop === item.lop);
    if (index >= 0) combined[index] = report;
    else combined.push(report);
  }
  return combined;
}

function rememberReport(report) {
  activeCache ||= { reports: [], pending: [], drafts: {} };
  activeCache.reports = [
    ...(activeCache.reports || []).filter((item) => !(item.date === report.date && item.lop === report.lop)),
    report,
  ];
}

function clearDraft(date, lop) {
  if (activeCache && activeCache.drafts && activeCache.drafts[date]) {
    delete activeCache.drafts[date][lop];
    if (!Object.keys(activeCache.drafts[date]).length) delete activeCache.drafts[date];
  }
}

async function load() {
  if (!currentUser) return;
  const date = $('#date').value;
  if (!navigator.onLine) {
    if (!activeCache || !Array.isArray(activeCache.classes)) {
      alert('Thiết bị chưa có dữ liệu lớp đã lưu. Hãy kết nối mạng và mở ứng dụng trước.');
      return;
    }
    offlineMode = true;
    classes = activeCache.classes;
    reports = combineWithPending(activeCache.reports, activeCache.pending, date);
    restoreDraft();
    render();
    return;
  }
  try {
    const classRes = await fetch('/api/classes');
    if (classRes.status === 401) throw new Error('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.');
    if (!classRes.ok) throw new Error('Không tải được danh sách lớp');
    classes = await classRes.json();
    if (activeCache && activeCache.pending && activeCache.pending.length) await syncPending();
    const reportRes = await fetch('/api/reports?date=' + encodeURIComponent(date));
    if (reportRes.status === 401) throw new Error('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.');
    if (!reportRes.ok) throw new Error('Không tải được báo cáo điểm danh');
    const todaysReports = await reportRes.json();
    activeCache ||= { reports: [], pending: [], drafts: {} };
    activeCache.classes = classes;
    activeCache.reports = [
      ...reportsForDate(activeCache.reports, date),
      ...reportsForDate(todaysReports, date),
    ];
    const otherDates = (activeCache.reports || []).filter((report) => report.date !== date);
    activeCache.reports = [...otherDates, ...reportsForDate(todaysReports, date)];
    reports = combineWithPending(todaysReports, activeCache.pending, date);
    if (currentUser.role === 'admin') {
      const usersRes = await fetch('/api/users');
      if (!usersRes.ok) throw new Error('Không tải được danh sách tài khoản');
      users = await usersRes.json();
    }
    offlineMode = false;
    restoreDraft();
    saveOfflineCache();
    render();
  } catch (error) {
    if (error.name === 'TypeError' && activeCache && activeCache.classes) {
      offlineMode = true;
      classes = activeCache.classes;
      reports = combineWithPending(activeCache.reports, activeCache.pending, date);
      restoreDraft();
      render();
      return;
    }
    alert(error.message);
  }
}

function setUser(user) {
  currentUser = user;
  $('#loginPanel').classList.toggle('hidden', !!user);
  $('#app').classList.toggle('hidden', !user);
  $('#account').classList.toggle('hidden', !user);
  $('#accountName').textContent = user ? `${user.username} (${user.role === 'admin' ? 'admin' : 'giáo viên trực'})` : '';
  updateOfflineLogin();
}

function persistAndroidSession() {
  if (window.AndroidSession && typeof window.AndroidSession.persistSession === 'function') {
    window.AndroidSession.persistSession();
  }
}

$('#loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  $('#loginError').textContent = '';
  const loginForm = event.currentTarget;
  const form = new FormData(loginForm);
  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: form.get('username'), password: form.get('password') }),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Đăng nhập thất bại');
    persistAndroidSession();
    loginForm.reset();
    offlineMode = false;
    setUser(result.user);
    activeCache = getOfflineCache(result.user.username) || { reports: [], pending: [], drafts: {} };
    activeCache.user = result.user;
    saveOfflineCache();
    await load();
  } catch (error) {
    const username = String(form.get('username') || '').trim();
    const cached = getOfflineCache(username);
    if (error instanceof TypeError && cached && cached.user && Array.isArray(cached.classes)) {
      loginForm.reset();
      activeCache = cached;
      offlineMode = true;
      setUser(cached.user);
      await load();
    } else {
      $('#loginError').textContent = error.message;
    }
  }
});

$('#offlineLogin').addEventListener('click', async () => {
  const cached = cachedUser();
  if (!cached) return updateOfflineLogin();
  activeCache = cached;
  offlineMode = true;
  setUser(cached.user);
  await load();
});

$('#logout').addEventListener('click', async () => {
  if (navigator.onLine) {
    try {
      const response = await fetch('/api/logout', { method: 'POST' });
      if (!response.ok) console.error('Máy chủ không xác nhận đăng xuất.');
    } catch (error) {
      console.error('Không thể đăng xuất trên máy chủ:', error);
    }
  }
  if (window.AndroidSession && typeof window.AndroidSession.clearSession === 'function') {
    window.AndroidSession.clearSession();
  }
  setUser(null);
  try { localStorage.removeItem(LAST_USER_KEY); } catch (error) {
    console.error('Không xóa được tài khoản offline đã dùng:', error);
  }
  updateOfflineLogin();
  activeCache = null;
  offlineMode = false;
  offlineStorageError = false;
  users = [];
  classes = [];
  reports = [];
  $('#app').innerHTML = '';
});

document.addEventListener('click', (event) => {

async function checkSession() {

function go(k, i) {
  const n = classes[k].lop.length;
  saveDraft();
  curK = k; curI = Math.max(0, Math.min(n - 1, i));
  showPage();
}

function showPage() {
  const k = classes[curK];
  $('#khoiTabs').innerHTML = classes.map((x, i) =>
    `<button class="tab ${i === curK ? 'on' : ''}" data-k="${i}">${esc(x.khoi)}</button>`).join('');
  $('#lopTabs').innerHTML = k.lop.map((l, i) => {
    const draftRows = Object.values(state[l.ten] || {}).filter((row) => row.on);
    const report = reports.find((r) => r.lop === l.ten);
    const hasDraft = draftRows.length > 0;
    const sum = hasDraft
      ? draftRows.reduce((total, row) => total + (Number(row.qty) || 0), 0)
      : report ? Number(report.tong) || 0 : null;
    const matches = sum !== null && sum === l.siSo;
    const status = sum === null ? '' : matches
      ? '<span class="status-mark ok"> ✔</span>'
      : '<span class="status-mark error"> ✕</span>';
    const statusClass = sum === null ? '' : matches ? 'okTab' : 'errorTab';
    return `<button class="tab ${i === curI ? 'on' : ''} ${statusClass}" data-i="${i}">${esc(l.ten)}${status}</button>`;
  }).join('');
  document.querySelectorAll('#cards .card').forEach((c) => {
    c.classList.toggle('hidden', !(+c.dataset.ki === curK && +c.dataset.li === curI));
  });
  $('#pageInfo').textContent = `Trang ${curI + 1}/${k.lop.length}`;
  $('#prev').disabled = curI === 0;
  $('#next').disabled = curI === k.lop.length - 1;
}

document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.classList.contains('section-tab')) {
    activeSection = t.dataset.section;
    showSection();
  } else if (t.dataset.k !== undefined && t.classList.contains('tab')) go(+t.dataset.k, 0);
  else if (t.dataset.i !== undefined && t.classList.contains('tab')) go(curK, +t.dataset.i);
  else if (t.id === 'prev') go(curK, curI - 1);
  else if (t.id === 'next') go(curK, curI + 1);
});

// vuốt trái/phải trên điện thoại để lật lớp
let sx = null;
document.addEventListener('touchstart', (e) => { sx = e.target.closest('input, textarea') ? null : e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 80) go(curK, curI + (dx < 0 ? 1 : -1));
});

function cardHTML(khoi, l) {
  const done = reports.find((r) => r.lop === l.ten);
  const rows = ROWS.map(([key, label]) => `
    <div class="row" data-key="${key}">
      <label><input type="checkbox" class="chk"><span class="row-icon icon-${key}" aria-hidden="true">${ROW_ICONS[key]}</span><span>${label}</span></label>
      <input type="number" class="qty hidden" min="0" step="1" placeholder="Số lượng">
      ${key === 'khac' ? '<input type="text" class="reason hidden" placeholder="Ghi lý do...">' : ''}
    </div>`).join('');
  const doneHTML = done ? `
    <div class="thumbs">${done.rows.map((r) => `<div class="muted"><span class="report-icon icon-${esc(r.key)}" aria-hidden="true">${ROW_ICONS[r.key] || '📌'}</span><b>${esc(r.label)}: ${r.qty}</b>${r.reason ? '<br>Lý do: ' + esc(r.reason) : ''}</div>`).join('')}</div>
    <div class="muted">Người nộp: ${esc(done.createdBy || 'Không rõ')}</div>
    ${currentUser.role === 'admin' && !offlineMode ? '<button class="ghost delete-report">Xóa báo cáo</button>' : ''}` : '';
  const pending = done && activeCache && activeCache.pending && activeCache.pending.some((item) => item.date === done.date && item.lop === done.lop);
  return `
  <div class="card ${done ? 'done' : ''}" id="c-${l.ten}" data-lop="${l.ten}" data-khoi="${esc(khoi)}">
    <div class="head"><b>Lớp ${esc(l.ten)}</b>
      <span class="muted">Sĩ số: <input type="number" class="siso" min="1" value="${l.siSo}" aria-label="Chỉnh sĩ số lớp ${esc(l.ten)}" style="width:70px; font-weight:700" ${offlineMode ? 'disabled' : ''}>
      <span class="class-state ${done && !pending ? 'submitted' : ''}">${done ? pending ? 'Chờ đồng bộ' : 'Đã nộp' : 'Chưa nộp'}</span></span></div>
    ${rows}
    <div class="total red"><span>Tổng điểm danh</span><span class="sum">0 / ${l.siSo}</span></div>
    <button class="submit" disabled>Submit</button>
    ${doneHTML}
  </div>`;
}

function updateTotal(lop) {
  const card = $('#c-' + CSS.escape(lop));
  const siSo = classes.flatMap((k) => k.lop).find((l) => l.ten === lop).siSo;
  const st = state[lop];
  const sum = Object.values(st).reduce((s, v) => s + (v.on ? Number(v.qty || 0) : 0), 0);
  const selected = Object.values(st).filter((v) => v.on);
  const report = reports.find((item) => item.lop === lop);
  const hasDraft = selected.length > 0;
  const displaySum = hasDraft ? sum : report ? Number(report.tong) || 0 : sum;
  const matches = siSo > 0 && displaySum === siSo;
  const canSubmit = selected.length > 0 && selected.every((v) =>
    String(v.qty).trim() !== '' && Number.isInteger(Number(v.qty)) && Number(v.qty) >= 0);
  const t = $('.total', card);
  t.className = 'total ' + (matches ? 'green' : hasDraft || report ? 'red' : 'neutral');
  $('.sum', card).textContent = `${displaySum} / ${siSo}` + (matches ? ' ✔' : hasDraft || report ? ' ✕' : '');
  $('.submit', card).disabled = !canSubmit;
}

let sisoTimer;
document.addEventListener('input', (e) => {
  if (e.target.classList.contains('siso')) {
    if (offlineMode) return;
    const card = e.target.closest('.card'), lop = card.dataset.lop;
    const cls = classes.flatMap((k) => k.lop).find((l) => l.ten === lop);
    cls.siSo = Math.floor(Number(e.target.value)) || 0;
    updateTotal(lop);
    showPage();
    clearTimeout(sisoTimer);
    if (cls.siSo > 0) sisoTimer = setTimeout(async () => {
      try {
        const response = await fetch('/api/siso', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lop, siSo: cls.siSo }),
        });
        if (!response.ok) {
          const result = await response.json();
          alert(result.error || 'Không lưu được sĩ số');
        }
      } catch (error) {
        alert(error.message || 'Không lưu được sĩ số');
      }
    }, 500);
    return;
  }
  const row = e.target.closest('.row'); if (!row) return;
  const card = row.closest('.card'), lop = card.dataset.lop, key = row.dataset.key;
  const st = (state[lop][key] ||= { on: false, qty: '', reason: '' });
  if (e.target.classList.contains('chk')) {
    st.on = e.target.checked;
    $('.qty', row).classList.toggle('hidden', !st.on);
    const r = $('.reason', row); if (r) r.classList.toggle('hidden', !st.on);
    if (st.on) $('.qty', row).focus();
  }
  if (e.target.classList.contains('qty')) st.qty = e.target.value;
  if (e.target.classList.contains('reason')) st.reason = e.target.value;
  saveDraft();
  updateTotal(lop);
  showPage();
});

// ---- Nộp điểm danh ----
async function submitClass(card) {
  const lop = card.dataset.lop, khoi = card.dataset.khoi;
  const items = ROWS.map(([key, label]) => ({ key, label, ...(state[lop][key] || {}) }))
    .filter((r) => r.on && String(r.qty).trim() !== '');
  if (!items.length || items.some((r) => !Number.isInteger(Number(r.qty)) || Number(r.qty) < 0)) {
    alert('Hãy chọn ít nhất một mục và nhập số nguyên không âm.');
    return;
  }
  const thieu = items.find((r) => r.key === 'khac' && Number(r.qty) > 0 && !(r.reason || '').trim());
  if (thieu) { alert('Mục "Khác" chưa ghi lý do.'); return; }
  const btn = $('.submit', card); btn.disabled = true;
  const payload = { date: $('#date').value, khoi, lop,
    rows: items.map((r) => ({ key: r.key, label: r.label, qty: Number(r.qty), reason: r.reason || '' })) };
  if (offlineMode || !navigator.onLine) {
    activeCache ||= { classes, reports: [], pending: [], drafts: {} };
    activeCache.pending ||= [];
    activeCache.pending = activeCache.pending.filter((item) => !(item.date === payload.date && item.lop === lop));
    activeCache.pending.push({ ...payload, siSo: classes.flatMap((group) => group.lop).find((cls) => cls.ten === lop).siSo,
      tong: items.reduce((sum, item) => sum + Number(item.qty), 0), createdBy: currentUser.username,
      time: new Date().toISOString(), queuedAt: Date.now() });
    rememberReport(activeCache.pending[activeCache.pending.length - 1]);
    delete state[lop];
    clearDraft(payload.date, lop);
    saveOfflineCache();
    await load();
  } else {
    try {
      const res = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload) });
      const out = await res.json();
      if (!res.ok) { alert(out.error); btn.disabled = false; return; }
      const cls = classes.flatMap((group) => group.lop).find((item) => item.ten === lop);
      rememberReport({ ...payload, siSo: cls.siSo, tong: items.reduce((sum, item) => sum + Number(item.qty), 0),
        createdBy: currentUser.username, time: new Date().toISOString() });
      delete state[lop];
      clearDraft(payload.date, lop);
      saveOfflineCache();
      await load();
    } catch (error) {
      btn.disabled = false;
      if (error instanceof TypeError) {
        offlineMode = true;
        await submitClass(card);
      } else {
        alert(error.message);
      }
      return;
    }
  }
  if (curI < classes[curK].lop.length - 1) go(curK, curI + 1);
}

async function syncPending() {
  if (!activeCache || !Array.isArray(activeCache.pending) || !navigator.onLine) return;
  for (const item of [...activeCache.pending]) {
    try {
      const response = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: item.date, khoi: item.khoi, lop: item.lop, rows: item.rows }),
      });
      if (response.status === 401) {
        item.syncError = 'Phiên đăng nhập hết hạn; hãy đăng nhập lại để đồng bộ.';
        continue;
      }
      const result = await response.json();
      if (!response.ok) {
        item.syncError = result.error || 'Máy chủ từ chối báo cáo.';
        continue;
      }
      activeCache.pending = activeCache.pending.filter((pending) => pending !== item);
      item.syncError = '';
    } catch (error) {
      if (!(error instanceof TypeError)) throw error;
      item.syncError = 'Chưa kết nối được máy chủ.';
      break;
    }
  }
  saveOfflineCache();
}

function excelColumn(index) {
  let result = '';
  for (let n = index + 1; n > 0; n = Math.floor((n - 1) / 26)) {
    result = String.fromCharCode(65 + (n - 1) % 26) + result;
  }
  return result;
}

function xmlEscape(value) {
  return String(value ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

function crc32(bytes) {
  let crc = -1;
  for (const byte of bytes) {
    crc ^= byte;
    for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ (crc & 1 ? 0xEDB88320 : 0);
  }
  return (crc ^ -1) >>> 0;
}

function zipStore(files) {
  const encoder = new TextEncoder();
  const localParts = [], centralParts = [];
  let offset = 0;
  const u16 = (view, position, value) => view.setUint16(position, value, true);
  const u32 = (view, position, value) => view.setUint32(position, value >>> 0, true);
  for (const [name, content] of Object.entries(files)) {
    const nameBytes = encoder.encode(name), data = encoder.encode(content), checksum = crc32(data);
    const local = new Uint8Array(30 + nameBytes.length), localView = new DataView(local.buffer);
    u32(localView, 0, 0x04034B50); u16(localView, 4, 20); u16(localView, 6, 0x0800);
    u16(localView, 8, 0); u16(localView, 12, 0x21); u32(localView, 14, checksum); u32(localView, 18, data.length);
    u32(localView, 22, data.length); u16(localView, 26, nameBytes.length);
    local.set(nameBytes, 30);
    localParts.push(local, data);

    const central = new Uint8Array(46 + nameBytes.length), centralView = new DataView(central.buffer);
    u32(centralView, 0, 0x02014B50); u16(centralView, 4, 20); u16(centralView, 6, 20);
    u16(centralView, 8, 0x0800); u16(centralView, 10, 0); u16(centralView, 14, 0x21);
    u32(centralView, 16, checksum); u32(centralView, 20, data.length); u32(centralView, 24, data.length);
    u16(centralView, 28, nameBytes.length); u32(centralView, 42, offset);
    central.set(nameBytes, 46);
    centralParts.push(central);
    offset += local.length + data.length;
  }
  const centralSize = centralParts.reduce((size, part) => size + part.length, 0);
  const end = new Uint8Array(22), endView = new DataView(end.buffer);
  u32(endView, 0, 0x06054B50); u16(endView, 8, centralParts.length); u16(endView, 10, centralParts.length);
  u32(endView, 12, centralSize); u32(endView, 16, offset);
  return new Blob([...localParts, ...centralParts, end], {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  });
}

function exportExcel() {
  const date = $('#date').value;
  const dayReports = reportsForDate(reports, date);
  if (!dayReports.length) {
    alert('Ngày đang chọn chưa có báo cáo đã tải hoặc đã lưu trên thiết bị.');
    return;
  }
  const headers = [
    'Ngày', 'Khối', 'Lớp', 'Sĩ số', 'Tổng',
    ...ROWS.map(([, label]) => label),
    'Lý do khác', 'Người nộp', 'Thời gian',
  ];
  const rows = [headers];
  for (const report of dayReports) {
    const quantities = new Map(ROWS.map(([key]) => [key, 0]));
    let reason = '';
    for (const item of report.rows || []) {
      if (quantities.has(item.key)) {
        quantities.set(item.key, quantities.get(item.key) + (Number(item.qty) || 0));
      }
      if (item.key === 'khac' && item.reason) reason = item.reason;
    }
    rows.push([
      report.date, report.khoi, report.lop, report.siSo, report.tong,
      ...ROWS.map(([key]) => quantities.get(key)),
      reason, report.createdBy || '', report.time || '',
    ]);
  }
  const sheetRows = rows.map((row, rowIndex) => `<row r="${rowIndex + 1}">${row.map((value, columnIndex) => {
    const ref = `${excelColumn(columnIndex)}${rowIndex + 1}`;
    if (typeof value === 'number' && Number.isFinite(value)) return `<c r="${ref}"><v>${value}</v></c>`;
    return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(value)}</t></is></c>`;
  }).join('')}</row>`).join('');
  const files = {
    '[Content_Types].xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>',
    '_rels/.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Điểm danh" sheetId="1" r:id="rId1"/></sheets></workbook>',
    'xl/_rels/workbook.xml.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>',
    'xl/worksheets/sheet1.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheetRows}</sheetData></worksheet>`,
  };
  const blob = zipStore(files);
  const link = document.createElement('a');
  link.download = `diem-danh-${date}.xlsx`;
  if (window.AndroidFileDownload && typeof window.AndroidFileDownload.saveFile === 'function') {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || '');
      const separator = dataUrl.indexOf(',');
      if (separator < 0) {
        alert('Không tạo được dữ liệu file Excel.');
        return;
      }
      window.AndroidFileDownload.saveFile(link.download, dataUrl.slice(separator + 1));
    };
    reader.onerror = () => alert('Không đọc được file Excel vừa tạo.');
    reader.readAsDataURL(blob);
    return;
  }
  link.href = URL.createObjectURL(blob);
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

document.addEventListener('click', (event) => {
  if (event.target.id === 'exportExcel') exportExcel();
});

window.addEventListener('online', () => {
  if (currentUser) load();
});
window.addEventListener('offline', () => {
  if (currentUser) load();
});

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('/service-worker.js').catch((error) => {
    console.error('Không đăng ký được service worker:', error);
  });
}

checkSession().catch((error) => {
  $('#loginError').textContent = error.message;
  $('#loginPanel').classList.remove('hidden');
  updateOfflineLogin();
});
</script>
